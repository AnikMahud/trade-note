name: Dip-buy scanner alert

on:
  schedule:
    # Every 15 min, all day every day (UTC) — notify.js itself gates on
    # actual US/Eastern market hours so DST doesn't need to be handled here.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scanner and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/notify.js

      - name: Persist notification state
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scanner-state.json
          git diff --cached --quiet || git commit -m "chore: update scanner alert state"
          git push
