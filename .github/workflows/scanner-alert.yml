name: Dip-buy scanner alert

on:
  schedule:
    # Every 15 min, offset off the :00/:15/:30/:45 marks — those are GitHub's
    # busiest minutes and scheduled runs there get delayed/dropped most often.
    # notify.js itself gates on actual US/Eastern market time so DST doesn't
    # need to be handled here.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Runs get triggered externally every 1-2 min (in addition to GitHub's own
# schedule as a backup) — queue them instead of letting overlapping runs
# race on committing/pushing scanner-state.json.
concurrency:
  group: scanner-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scanner and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/notify.js

      - name: Persist notification state
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scanner-state.json
          git diff --cached --quiet || git commit -m "chore: update scanner alert state"
          git push
